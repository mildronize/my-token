openapi: 3.0.3
info:
  title: my-token BFF API
  version: "1.0.0"
  description: >
    The BFF's session-authenticated JSON surface (milestone-3
    `.chief/milestone-3/_contract/API.md`), consumed only by the SPA
    running in the owner's own browser. Every request authenticates over
    a signed, HttpOnly session cookie, resolved by
    `internal/transport/bff`'s own session middleware
    (`bff.RequireJSONSession`) — not by anything in this spec: no
    `security` scheme is declared here on purpose, for the exact same
    reason `openapi.yaml`'s own header comment gives for that file: this
    spec's job is request/response *shape* validation (`gin-middleware`),
    not auth. A second, independent file from `openapi.yaml` on purpose
    (`_contract/API.md` "Two specs, not one") — the public API
    (Bearer-authenticated, agent-facing) and this BFF surface
    (session-authenticated, owner-facing browser only) are two disjoint
    proof-of-identity mechanisms by construction (I2/I12), and a single
    shared spec file would blur that boundary even though the code
    enforces it.

    Deliberately absent from this surface: there is no key issuance or
    rotation endpoint here (no `POST /keys`, no rotate) — same reasoning
    `openapi.yaml`'s own `/keys/{id}` comment gives: a raw key can't be
    returned safely over an HTTP response, so issuance and rotation stay
    CLI-only regardless of which surface is asking (`_contract/API.md`,
    `milestone-3/_goal/GOAL.md` Done-when 5).

    `/keys` below spans every `role='agent'` user's own keys, not the
    session owner's (I21) — milestone-2/3's session-owner-scoped
    semantics (structurally always empty, since no key is ever issued to
    `role='owner'`, I2) are REPLACED here, not kept alongside a new
    endpoint. `/users` (I21's own follow-up) lists every active user,
    either role — owner-session only, list-only, mirroring my-task's own
    `user.ts` router exactly.
servers:
  - url: /api/bff
paths:
  /me:
    get:
      operationId: getMe
      summary: Session-check endpoint backing the SPA's AuthGate-equivalent hook.
      description: >
        Same response shape as the public API's `GET /api/v1/me`,
        deliberately — one response shape for "who am I," regardless of
        which surface asked.
      responses:
        "200":
          description: The signed-in owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /keys:
    get:
      operationId: listKeys
      summary: List every agent's non-revoked API keys (I21).
      description: >
        Every `role='agent'` user's non-revoked keys (`revoked_at IS
        NULL`), not just the session owner's own — the session owner
        never holds a key at all (`role='owner'` can't be issued one,
        I2), so scoping this to the caller would always return empty,
        which was milestone-2/3's actual bug. Regardless of expiry: an
        expired-but-unrevoked key still shows up so the owner can see it
        needs rotating. Each row carries the owning agent's `handle`
        (never null — only rows a real users JOIN produced ever reach
        this response), so the owner can tell whose key is whose before
        revoking one.
      responses:
        "200":
          description: Every agent's non-revoked keys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokeKey
      summary: Revoke any agent's API key by id (I21).
      description: >
        Sets `revoked_at`. Not scoped to a "caller's own" key — there is
        no such thing on this owner-only surface (I2) — any agent's key
        id may be revoked, session-gated only. An unknown id is
        `404 not_found`, the same "absence, not permission" shape every
        other owner-scoped-by-nothing-left-to-scope lookup on this
        surface uses. No `POST /keys` and no rotate endpoint anywhere on
        this surface, deliberately — a raw key can't be returned safely
        over an HTTP response, so issuance/rotation stay CLI-only
        (`cmd/issue-key`) regardless of which surface is asking.
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /users:
    get:
      operationId: listUsers
      summary: List every active user, either role.
      description: >
        Mirrors my-task's own `user.ts` router (`list` only, `WHERE
        active = true ORDER BY handle`, "humans and agents in one list").
        List only: no create, no update, no delete — my-task's router has
        none of those either, and there is no reason to exceed it.
        Owner-session only, same tier as every other endpoint on this
        surface; an agent has no business enumerating users (there is no
        equivalent on `openapi.yaml`'s public API at all).
      responses:
        "200":
          description: Every active user, ordered by handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /usage/summary:
    get:
      operationId: getUsageSummary
      summary: Usage totals and one-dimension breakdown for a time window.
      description: >
        story-1/ticket-14: the console's own read surface over
        `usage_events` (`_rules/../story-1/_contract/contract.md`'s
        "API surface" section — wire field names below are copied
        verbatim from that contract, including its `snake_case`
        `group_by`/`reporting_installs`, which deliberately breaks from
        this surface's own camelCase convention elsewhere; not
        "corrected" here since the contract is this ticket's literal
        input, not something to reopen). `window` selects the
        [start, now) range (`today`/`week`/`month` are calendar-anchored
        at UTC midnight/Monday/1st; `5h`/`24h` are rolling); `group_by`
        picks which dimension the `breakdown` array is keyed by.
        `totals.tokens` sums all four raw token counters per event
        (input + output + cache_read + cache_creation) — a single
        display number, distinct from ticket 9's "never summed into
        each other" rule about the *stored* per-field columns, which
        this endpoint only ever reads, never rewrites.
        `reporting_installs` is the count of distinct `machine` values
        with at least one event inside the selected window (not
        lifetime) — the goal's partial-view caveat, scoped to what the
        rest of this response actually covers.


        `lifetime` was originally a sixth value, additive to the
        contract's own fixed five (`_contract/contract.md`'s API surface
        section originally named exactly `5h|24h|today|week|month`) —
        flagged as a build-time decision in ticket 14's own report: the
        ticket's own mockup spec names a "lifetime cost" summary tile,
        which none of the five original windows could answer (each has a
        bounded start). `lifetime` covers every event ever ingested up to
        now, with no left bound.

        story-1/ticket-20 adds `year` (calendar-anchored at Jan 1 00:00
        UTC of the current year, matching `today`/`week`/`month`'s own
        calendar-boundary convention — not a rolling 365-day window), and
        reopens ticket 14's "`lifetime` is query-string-additive only,
        never in the fixed table" call: both `year` and `lifetime` are
        now real, selectable tabs that also drive `GET /usage/windows`'
        own fixed table (now seven rows, see that operation below), not
        just this endpoint's own `window` query parameter.
      parameters:
        - name: window
          in: query
          required: true
          schema:
            type: string
            enum: [5h, 24h, today, week, month, year, lifetime]
        - name: group_by
          in: query
          required: true
          schema:
            type: string
            enum: [actor, path, machine]
        - name: machine
          in: query
          required: false
          schema:
            type: string
          description: >
            story-2/ticket-10: optional install_id filter. When set,
            scopes `totals`/`breakdown`/`reporting_installs` to only
            events reported by this machine -- not just one panel's own
            dimension (contract's Console filters section: global, not
            per-panel). AND-composed with `window` and with `scan_root`
            when both are set. Absent means no machine constraint.
        - name: scan_root
          in: query
          required: false
          schema:
            type: string
          description: >
            story-2/ticket-10: optional composite
            `<install_id>:<scan_root_path>` filter -- same
            machine-prefix convention as `group_by=path`'s own
            cross-machine fix (ticket 7), for the identical reason: a
            bare scan-root path/name is ambiguous across machines since
            naming is per-install (contract's Data model). AND-composed
            with `window` and with `machine` when both are set. An
            invalid shape, or a well-formed but non-existent
            `install_id:scan_root_path` pair, yields an empty/zero
            result -- not a 400 -- mirroring this API's existing
            "no matching data" tolerance versus a malformed request.
      responses:
        "200":
          description: Totals, a breakdown by the requested dimension, and the window-scoped reporting-install count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /usage/windows:
    get:
      operationId: getUsageWindows
      summary: Turns/tokens/cost for each of the fixed 5h/24h/today/week/month/year/lifetime windows.
      description: >
        story-1/ticket-14: backs the console's time-window table — one
        row per fixed window, each computed the same way
        `getUsageSummary`'s own `window` parameter computes its range,
        with no `group_by` (each row is this service's whole reporting
        surface's totals for that window, not split by dimension).

        story-1/ticket-20: grows from five rows to seven — `year` and
        `lifetime` are now real, selectable tabs (reopening ticket 14's
        "lifetime is tab-only-tile, never a tab" call), so both belong in
        this fixed table too for consistency between what's clickable and
        what's listed.

        story-2/ticket-10: gains the same two optional `machine`/
        `scan_root` filters `getUsageSummary` already has, so the fixed
        table also respects an active console filter (story-1 shipped
        this endpoint with zero params) -- see that operation's own
        `machine`/`scan_root` parameter docs for the exact semantics,
        identical here.
      parameters:
        - name: machine
          in: query
          required: false
          schema:
            type: string
          description: story-2/ticket-10 -- same optional install_id filter as getUsageSummary's own `machine` parameter.
        - name: scan_root
          in: query
          required: false
          schema:
            type: string
          description: story-2/ticket-10 -- same optional `<install_id>:<scan_root_path>` filter as getUsageSummary's own `scan_root` parameter.
      responses:
        "200":
          description: One row per fixed window, in 5h, 24h, today, week, month, year, lifetime order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageWindows"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /usage/scan-roots:
    get:
      operationId: getUsageScanRoots
      summary: Every registered scan root across every reporting install.
      description: >
        story-2/ticket-9: no parameters — exists purely to populate the
        console's future scan-root filter dropdown (ticket 11), since
        there is no `group_by=scan_root` breakdown panel this story's
        scope adds to derive the list from otherwise. Each row joins
        `scan_roots` to `machines` on `install_id` for the hostname, the
        same join style `getUsageSummary`'s own hostname substitution
        already uses (read via a repo method, not a SQL JOIN, per that
        same precedent) — `hostname` falls back to the raw `install_id`
        itself if a scan root's install_id has no corresponding
        `machines` row (shouldn't normally happen given both are upserted
        from the same ingestion batch, but the same "never a blank label"
        rule `getUsageSummary`'s own `machine`/`path` group_by fallback
        already sets applies here too).
      responses:
        "200":
          description: Every registered scan root, across every reporting install.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageScanRootList"
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  schemas:
    Me:
      type: object
      required: [handle, role, active]
      properties:
        handle:
          type: string
        role:
          type: string
        active:
          type: boolean
    ApiKey:
      type: object
      required: [id, prefix, handle, createdAt, expiresAt]
      properties:
        id:
          type: string
        prefix:
          type: string
        handle:
          type: string
          description: >
            milestone-4 fix-round (handle-exposure): the owning agent's
            handle — my-task's own api-key-settings.tsx shows `{k.handle}`
            on every row and its revoke dialog names the agent by handle
            ("Revoke {handle}'s key?"); this endpoint (GET /api/bff/keys)
            already JOINs users for every row it returns (I21 — every key
            here belongs to a role='agent' user), so this is always
            present, never null.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ApiKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ApiKey"
    User:
      type: object
      required: [id, handle, role, active]
      description: >
        One row of GET /users. Every active user, either role — `role`
        rides along so a client could group/label by it.
      properties:
        id:
          type: string
        handle:
          type: string
        role:
          type: string
          enum: [owner, agent]
        active:
          type: boolean
          description: >
            Always `true` on every row this endpoint returns (`WHERE
            active = true` server-side) — present on the wire anyway so
            this schema doesn't silently drift from `Me`'s own
            `{handle, role, active}` shape if that ever changes.
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
    UsageTotals:
      type: object
      additionalProperties: false
      required: [tokens, cost, turns]
      properties:
        tokens:
          type: integer
          format: int64
        cost:
          type: number
          format: double
        turns:
          type: integer
          format: int64
    UsageBreakdownRow:
      type: object
      additionalProperties: false
      required: [key, tokens, cost, turns]
      properties:
        key:
          type: string
          description: >
            The dimension value to display: an actor name, a canonicalized
            path, or — group_by=machine, story-1/ticket-18 — the
            reporting machine's `hostname` (joined from `machines` on
            `usage_events.machine` = `machines.install_id`), not the raw
            `install_id`, falling back to the raw `install_id` itself if a
            machine has events but no corresponding `machines` row.
            group_by=path (story-2/ticket-7) is machine-prefixed:
            `<hostname>:<path>` once substituted, falling back to
            `<install_id>:<path>` the same way. Display shortening beyond
            this substitution (contract's "Console display rules", `path`
            basename/collision handling) is still the SPA's own job, not
            this endpoint's.
        raw_key:
          type: string
          description: >
            Present only when `key` has been substituted for a friendlier
            display value: group_by=machine (`key` becomes the hostname,
            raw_key the machine's `install_id`), or — story-2/ticket-7 —
            group_by=path (`key` becomes `<hostname>:<path>`, raw_key the
            ground-truth `<install_id>:<path>`). Carries the raw value so
            the console can still surface it, e.g. via a tooltip
            (contract's "machine label"/"Cross-machine path identity"
            rules — same "shortened label, full value still reachable"
            pattern in both cases). Absent for every other group_by, and
            for the no-machines-row fallback case, since `key` is already
            the raw value there.
        tokens:
          type: integer
          format: int64
        cost:
          type: number
          format: double
        turns:
          type: integer
          format: int64
    UsageSummary:
      type: object
      additionalProperties: false
      required: [totals, breakdown, reporting_installs]
      properties:
        totals:
          $ref: "#/components/schemas/UsageTotals"
        breakdown:
          type: array
          items:
            $ref: "#/components/schemas/UsageBreakdownRow"
          description: Every distinct key for the requested group_by within the window, cost descending.
        reporting_installs:
          type: integer
          format: int64
          description: Distinct `machine`s with at least one event inside the selected window — not lifetime.
    UsageWindowRow:
      type: object
      additionalProperties: false
      required: [window, turns, tokens, cost]
      properties:
        window:
          type: string
          enum: [5h, 24h, today, week, month, year, lifetime]
        turns:
          type: integer
          format: int64
        tokens:
          type: integer
          format: int64
        cost:
          type: number
          format: double
    UsageWindows:
      type: object
      additionalProperties: false
      required: [windows]
      properties:
        windows:
          type: array
          items:
            $ref: "#/components/schemas/UsageWindowRow"
    UsageScanRoot:
      type: object
      additionalProperties: false
      required: [install_id, hostname, scan_root_path, name, source_type]
      description: >
        story-2/ticket-9: one row of GET /usage/scan-roots. Field names
        are snake_case verbatim from the contract's own API surface
        section, matching the rest of this usage domain's own break from
        this spec's otherwise-camelCase convention (see getUsageSummary's
        own doc comment for why). story-3/ticket-2 adds `source_type`,
        additive to ticket-9's own shape (already a real column on
        `scan_roots` — story-2/ticket-8 — just never selected/exposed
        here since ticket-9 only needed this endpoint for the filter
        dropdown, which doesn't display it); no existing consumer needs
        to change.
      properties:
        install_id:
          type: string
          description: The reporting install's raw install_id — always present, even when hostname had to fall back to it.
        hostname:
          type: string
          description: >
            machines.hostname for this row's install_id, falling back to
            the raw install_id itself if no corresponding machines row
            exists (never a blank label).
        scan_root_path:
          type: string
          description: The raw scan-root path, as configured in the collector's own scan_paths.
        name:
          type: string
          description: The operator-assigned label for this scan root (per-install, no shared/global naming registry across machines).
        source_type:
          type: string
          description: >
            A declared category at config time (defaults to
            "claude_code" if the collector's own config omitted it) —
            same value ingested via the batch's own `scan_roots[].
            source_type` (openapi.yaml's `ScanRootInput`), read back
            verbatim here (story-3/ticket-2).
    UsageScanRootList:
      type: object
      additionalProperties: false
      required: [scan_roots]
      properties:
        scan_roots:
          type: array
          items:
            $ref: "#/components/schemas/UsageScanRoot"
          description: Every registered scan root across every reporting install.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            hint:
              type: string
  responses:
    BadRequest:
      description: The request violates a request-shape or validation rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: >
        Missing, expired, or wrong-role session cookie — same shape
        regardless of which check failed (I5). A behavior change from
        this package's own HTML `GET /` view: this JSON surface always
        answers 401, never a redirect (a `fetch` call can't follow a
        redirect the way a browser navigation does — the SPA's own
        AuthGate-equivalent hook is what turns a 401 into a redirect,
        client-side).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >
        Unknown id, or an id that exists but isn't the caller's (I3 —
        absence, not permission).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
